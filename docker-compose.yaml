name: ringr-agents

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ringr
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ringr"]
      interval: 1s
      timeout: 3s
      retries: 30

  api:
    build: .
    image: ringr-agents-api
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
    ports:
      - "8800:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000))"]
      interval: 1s
      timeout: 3s
      retries: 30
