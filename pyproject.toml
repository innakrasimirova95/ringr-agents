[project]
name = "ringr-agents"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==4.2.11",
    "gunicorn==21.2.0",
    "httpx==0.27.0",
    "psycopg[binary]>=3.2,<3.3",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]==4.2.7",
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-django==4.8.0",
    "ruff>=0.6,<0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings"
pythonpath = [".", "api"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
mypy_path = "api"
explicit_package_bases = true

[tool.django-stubs]
django_settings_module = "settings"

[tool.ruff]
line-length = 100
src = [".", "api"]
extend-exclude = ["**/migrations/"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
